name: intelegent-data-catalog

# Neo4j plus an Iceberg catalog (Apache Polaris) and OpenLineage (Marquez).

# Ollama runs on the host. 127.0.0.1 inside a container is not that server.
x-catalog-environment: &catalog-environment
  CATALOG_API__HOST: 0.0.0.0
  CATALOG_API__PORT: "8090"
  CATALOG_QUERY__SPARK_URL: http://spark-sql:8091
  CATALOG_POLARIS__URI: http://polaris:8181
  CATALOG_POLARIS__REALM: ${POLARIS_REALM:-POLARIS}
  CATALOG_POLARIS__CATALOG: ${POLARIS_CATALOG_NAME:-catalog}
  CATALOG_POLARIS__CLIENT_ID: ${POLARIS_ROOT_CLIENT_ID:-root}
  CATALOG_POLARIS__CLIENT_SECRET: ${POLARIS_ROOT_CLIENT_SECRET:-s3cr3t}
  CATALOG_DATABASE__URL: postgresql+psycopg://${CATALOG_DB_USER:-catalog}:${CATALOG_DB_PASSWORD:-catalog}@postgres:5432/${CATALOG_DB_NAME:-catalog}
  CATALOG_DATABASE__AUTO_MIGRATE: "true"
  CATALOG_TRINO__ENABLED: "true"
  CATALOG_TRINO__HOST: trino
  CATALOG_TRINO__PORT: "8080"
  CATALOG_NEO4J__ENABLED: "true"
  CATALOG_NEO4J__URI: bolt://neo4j:7687
  CATALOG_NEO4J__USER: ${NEO4J_USER:-neo4j}
  CATALOG_NEO4J__PASSWORD: ${NEO4J_PASSWORD:-password}
  CATALOG_LLM__PROVIDER: ${CATALOG_LLM__PROVIDER:-openai}
  CATALOG_LLM__API_KEY: ${CATALOG_LLM__API_KEY:-}
  CATALOG_LLM__BASE_URL: ${CATALOG_LLM__BASE_URL:-}
  CATALOG_LLM__MODEL: ${CATALOG_LLM__MODEL:-gpt-4.1}
  CATALOG_LLM__EFFORT: ${CATALOG_LLM__EFFORT:-low}
  CATALOG_LLM__GPT__API_KEY: ${CATALOG_LLM__GPT__API_KEY:-}
  # Local catalog models talk to host Ollama even when the default provider is OpenAI.
  CATALOG_LLM__LOCAL__BASE_URL: ${CATALOG_LLM__LOCAL__BASE_URL:-http://host.docker.internal:11434}
  CATALOG_MARQUEZ__ENABLED: "true"
  CATALOG_MARQUEZ__URL: http://marquez:5000
  CATALOG_OBSERVABILITY__ENABLED: "true"
  CATALOG_OBSERVABILITY__ENDPOINT: http://openobserve:5080/api/default
  CATALOG_OBSERVABILITY__USERNAME: ${OPENOBSERVE_USER:-root@example.com}
  CATALOG_OBSERVABILITY__PASSWORD: ${OPENOBSERVE_PASSWORD:-Local-observe-1}
  CATALOG_CELERY__BROKER_URL: redis://redis:6379/0
  CATALOG_AUTH__ENABLED: "true"
  CATALOG_AUTH__ISSUER: http://localhost:${KEYCLOAK_PORT:-8180}/realms/catalog
  CATALOG_AUTH__AUDIENCE: catalog-ui
  CATALOG_AUTH__JWKS_URL: http://keycloak:8080/realms/catalog/protocol/openid-connect/certs
  CATALOG_OBJECT_STORE__ENDPOINT: http://minio:9000
  CATALOG_OBJECT_STORE__ACCESS_KEY: ${MINIO_ROOT_USER:-polaris_root}
  CATALOG_OBJECT_STORE__SECRET_KEY: ${MINIO_ROOT_PASSWORD:-polaris_pass}
  CATALOG_OBJECT_STORE__BUCKET: ${WORKSPACE_BUCKET:-workspace}
  CATALOG_OBJECT_STORE__REGION: ${AWS_REGION:-us-west-2}
  CATALOG_NOTEBOOK__ENABLED: "true"
  CATALOG_NOTEBOOK__GATEWAY_URL: http://notebook-kernel:8888
  CATALOG_NOTEBOOK__GATEWAY_TOKEN: ${NOTEBOOK_GATEWAY_TOKEN:-dev-notebook-token}
  CATALOG_NOTEBOOK__TICKET_SECRET: ${NOTEBOOK_TICKET_SECRET:-dev-notebook-ticket}
  CATALOG_NOTEBOOK__SEED_POSTGRES__ENABLED: "true"
  CATALOG_NOTEBOOK__SEED_POSTGRES__HOST: postgres
  CATALOG_NOTEBOOK__SEED_POSTGRES__DATABASE: ${SOURCE_DB_NAME:-sales}
  CATALOG_CREDENTIALS__SOURCE_DB__USER: sales_reader
  CATALOG_CREDENTIALS__SOURCE_DB__PASSWORD: ${SOURCE_DB_READER_PASSWORD:-sales_reader}

services:
  neo4j:
    image: neo4j:5.26-community
    container_name: intelegent-data-catalog-neo4j
    restart: unless-stopped
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-password}
      HEALTHCHECK_USER: ${NEO4J_USER:-neo4j}
      HEALTHCHECK_PASSWORD: ${NEO4J_PASSWORD:-password}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512m
    volumes:
      - neo4j_data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "cypher-shell -a bolt://localhost:7687 -u \"$$HEALTHCHECK_USER\" -p \"$$HEALTHCHECK_PASSWORD\" 'RETURN 1'",
        ]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 40s

  minio:
    image: elestio/minio:latest@sha256:25348a257f1ece1b192f25f6cd9854618fa86422ac87b494b5d4e629c556d4bd
    container_name: intelegent-data-catalog-minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-polaris_root}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-polaris_pass}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  bucket-setup:
    image: amazon/aws-cli:2.36.8
    container_name: intelegent-data-catalog-bucket-setup
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-polaris_root}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-polaris_pass}
      AWS_REGION: ${AWS_REGION:-us-west-2}
      AWS_DEFAULT_REGION: ${AWS_REGION:-us-west-2}
      AWS_ENDPOINT_URL: http://minio:9000
      WAREHOUSE_BUCKET: ${WAREHOUSE_BUCKET:-warehouse}
      WORKSPACE_BUCKET: ${WORKSPACE_BUCKET:-workspace}
    volumes:
      - ./docker/minio/create-bucket.sh:/create-bucket.sh:ro
    entrypoint: ["/bin/sh", "/create-bucket.sh"]

  postgres:
    image: postgres:18.6
    container_name: intelegent-data-catalog-postgres
    restart: unless-stopped
    shm_size: 256mb
    environment:
      POSTGRES_USER: ${POLARIS_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${POLARIS_DB_PASSWORD:-postgres}
      POSTGRES_DB: postgres
      POSTGRES_INITDB_ARGS: "--encoding UTF8 --data-checksums"
      POLARIS_DB_NAME: ${POLARIS_DB_NAME:-POLARIS}
      CATALOG_DB_USER: ${CATALOG_DB_USER:-catalog}
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD:-catalog}
      CATALOG_DB_NAME: ${CATALOG_DB_NAME:-catalog}
      SOURCE_DB_USER: ${SOURCE_DB_USER:-sales}
      SOURCE_DB_PASSWORD: ${SOURCE_DB_PASSWORD:-sales}
      SOURCE_DB_NAME: ${SOURCE_DB_NAME:-sales}
      SOURCE_DB_READER_PASSWORD: ${SOURCE_DB_READER_PASSWORD:-sales_reader}
      MARQUEZ_DB_USER: marquez
      MARQUEZ_DB_PASSWORD: marquez
      MARQUEZ_DB_NAME: marquez
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres/init-databases.sh:/docker-entrypoint-initdb.d/01-databases.sh:ro
      - ./docker/source-db/init.sql:/opt/source-init/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  polaris-bootstrap:
    image: apache/polaris-admin-tool:1.7.0
    container_name: intelegent-data-catalog-polaris-bootstrap
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POLARIS_PERSISTENCE_TYPE: relational-jdbc
      POLARIS_PERSISTENCE_RELATIONAL_JDBC_DATABASE_TYPE: postgresql
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/${POLARIS_DB_NAME:-POLARIS}
      QUARKUS_DATASOURCE_USERNAME: ${POLARIS_DB_USER:-postgres}
      QUARKUS_DATASOURCE_PASSWORD: ${POLARIS_DB_PASSWORD:-postgres}
    command:
      - bootstrap
      - --realm=${POLARIS_REALM:-POLARIS}
      - --credential=${POLARIS_REALM:-POLARIS},${POLARIS_ROOT_CLIENT_ID:-root},${POLARIS_ROOT_CLIENT_SECRET:-s3cr3t}

  polaris:
    image: apache/polaris:1.7.0
    container_name: intelegent-data-catalog-polaris
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      polaris-bootstrap:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
      bucket-setup:
        condition: service_completed_successfully
    ports:
      - "${POLARIS_HTTP_PORT:-8181}:8181"
      - "${POLARIS_MGMT_PORT:-8182}:8182"
    environment:
      AWS_REGION: ${AWS_REGION:-us-west-2}
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-polaris_root}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-polaris_pass}
      POLARIS_PERSISTENCE_TYPE: relational-jdbc
      POLARIS_PERSISTENCE_RELATIONAL_JDBC_DATABASE_TYPE: postgresql
      POLARIS_PERSISTENCE_RELATIONAL_JDBC_MAX_RETRIES: 5
      POLARIS_PERSISTENCE_RELATIONAL_JDBC_INITIAL_DELAY_IN_MS: 100
      POLARIS_PERSISTENCE_RELATIONAL_JDBC_MAX_DURATION_IN_MS: 5000
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/${POLARIS_DB_NAME:-POLARIS}
      QUARKUS_DATASOURCE_USERNAME: ${POLARIS_DB_USER:-postgres}
      QUARKUS_DATASOURCE_PASSWORD: ${POLARIS_DB_PASSWORD:-postgres}
      POLARIS_REALM_CONTEXT_REALMS: ${POLARIS_REALM:-POLARIS}
      polaris.realm-context.realms: ${POLARIS_REALM:-POLARIS}
      QUARKUS_OTEL_SDK_DISABLED: "true"
      QUARKUS_HTTP_CORS_ENABLED: "true"
      QUARKUS_HTTP_CORS_ORIGINS: http://localhost:${POLARIS_UI_PORT:-8080},http://127.0.0.1:${POLARIS_UI_PORT:-8080}
      QUARKUS_HTTP_CORS_METHODS: GET,POST,PUT,DELETE,PATCH,OPTIONS
      QUARKUS_HTTP_CORS_HEADERS: Content-Type,Authorization,Polaris-Realm,X-Request-ID
      QUARKUS_HTTP_CORS_EXPOSED_HEADERS: "*"
      QUARKUS_HTTP_CORS_ACCESS_CONTROL_ALLOW_CREDENTIALS: "true"
      QUARKUS_HTTP_CORS_ACCESS_CONTROL_MAX_AGE: PT10M
      polaris.features."ALLOW_INSECURE_STORAGE_TYPES": "true"
      polaris.features."SUPPORTED_CATALOG_STORAGE_TYPES": '["FILE","S3","GCS","AZURE"]'
      polaris.readiness.ignore-severe-issues: "true"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8182/q/health"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 40s

  polaris-setup:
    image: alpine/curl:8.21.0
    container_name: intelegent-data-catalog-polaris-setup
    restart: "no"
    depends_on:
      polaris:
        condition: service_healthy
    environment:
      POLARIS_REALM: ${POLARIS_REALM:-POLARIS}
      POLARIS_ROOT_CLIENT_ID: ${POLARIS_ROOT_CLIENT_ID:-root}
      POLARIS_ROOT_CLIENT_SECRET: ${POLARIS_ROOT_CLIENT_SECRET:-s3cr3t}
      POLARIS_CATALOG_NAME: ${POLARIS_CATALOG_NAME:-catalog}
      WAREHOUSE_BUCKET: ${WAREHOUSE_BUCKET:-warehouse}
      S3_ENDPOINT: http://minio:9000
      S3_ENDPOINT_INTERNAL: http://minio:9000
      AWS_REGION: ${AWS_REGION:-us-west-2}
      OPENLINEAGE_NAMESPACE: ${OPENLINEAGE_NAMESPACE:-catalog}
      POLARIS_DB_USER: ${POLARIS_DB_USER:-postgres}
      POLARIS_DB_PASSWORD: ${POLARIS_DB_PASSWORD:-postgres}
      POLARIS_DB_NAME: ${POLARIS_DB_NAME:-POLARIS}
    volumes:
      - ./.local/polaris:/bootstrap
      - ./docker/polaris/setup.sh:/setup.sh:ro
    entrypoint: ["/bin/sh", "/setup.sh"]

  trino:
    image: trinodb/trino:476
    container_name: intelegent-data-catalog-trino
    restart: unless-stopped
    depends_on:
      polaris-setup:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/opt/trino/start.sh"]
    environment:
      POLARIS_URI: http://polaris:8181/api/catalog
      POLARIS_TOKEN_URI: http://polaris:8181/api/catalog/v1/oauth/tokens
      AWS_REGION: ${AWS_REGION:-us-west-2}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-polaris_root}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-polaris_pass}
      SOURCE_DB_USER: ${SOURCE_DB_USER:-sales}
      SOURCE_DB_PASSWORD: ${SOURCE_DB_PASSWORD:-sales}
      SOURCE_DB_NAME: ${SOURCE_DB_NAME:-sales}
      SOURCE_DB_READER_USER: ${SOURCE_DB_READER_USER:-sales_reader}
      SOURCE_DB_READER_PASSWORD: ${SOURCE_DB_READER_PASSWORD:-sales_reader}
    volumes:
      - ./.local/polaris:/bootstrap:ro
      - ./docker/trino/start.sh:/opt/trino/start.sh:ro
    ports:
      - "${TRINO_PORT:-8088}:8080"
    healthcheck:
      test: ["CMD", "/usr/lib/trino/bin/health-check"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s

  openobserve:
    image: openobserve/openobserve:v1.0.4-debug
    container_name: intelegent-data-catalog-openobserve
    restart: unless-stopped
    mem_limit: 1g
    ports:
      - "${OPENOBSERVE_PORT:-5080}:5080"
    environment:
      ZO_DATA_DIR: /data
      ZO_ROOT_USER_EMAIL: ${OPENOBSERVE_USER:-root@example.com}
      ZO_ROOT_USER_PASSWORD: ${OPENOBSERVE_PASSWORD:-Local-observe-1}
      ZO_MAX_FILE_SIZE_IN_MEMORY: "128"
      ZO_MEMORY_CACHE_MAX_SIZE: "128"
      ZO_MEMORY_CACHE_DATAFUSION_MAX_SIZE: "256"
      ZO_COMPACT_MAX_FILE_SIZE: "128"
    volumes:
      - openobserve_data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:5080/healthz"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  vector:
    image: timberio/vector:0.58.0-debian
    container_name: intelegent-data-catalog-vector
    restart: unless-stopped
    user: root
    depends_on:
      openobserve:
        condition: service_healthy
    environment:
      VECTOR_DANGEROUSLY_ALLOW_ENV_VAR_INTERPOLATION: "true"
      OPENOBSERVE_USER: ${OPENOBSERVE_USER:-root@example.com}
      OPENOBSERVE_PASSWORD: ${OPENOBSERVE_PASSWORD:-Local-observe-1}
    volumes:
      - ./docker/vector/vector.yaml:/etc/vector/vector.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - vector_data:/var/lib/vector
    command: ["--config", "/etc/vector/vector.yaml"]

  keycloak:
    image: quay.io/keycloak/keycloak:26.4.0
    container_name: intelegent-data-catalog-keycloak
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HTTP_PORT: "8080"
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8180}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "${KEYCLOAK_PORT:-8180}:8080"
    volumes:
      - ./docker/keycloak/realm-catalog.json:/opt/keycloak/data/import/realm-catalog.json:ro

  redis:
    image: redis:7-alpine
    container_name: intelegent-data-catalog-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  catalog-api:
    build:
      context: .
      dockerfile: docker/catalog-api/Dockerfile
    image: intelegent-data-catalog-api:local
    container_name: intelegent-data-catalog-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      polaris:
        condition: service_healthy
      spark-sql:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      marquez:
        condition: service_healthy
      openobserve:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_started
      notebook-kernel:
        condition: service_healthy
    ports:
      - "${CATALOG_API_PORT:-8090}:8090"
    environment: *catalog-environment
    healthcheck:
      test:
        [
          "CMD",
          "/app/.venv/bin/python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/api/v1/health')",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  catalog-worker:
    image: intelegent-data-catalog-api:local
    container_name: intelegent-data-catalog-worker
    restart: unless-stopped
    command: ["celery", "-A", "intelegent_data_catalog.jobs.celery_app", "worker", "-E"]
    depends_on:
      redis:
        condition: service_healthy
      catalog-api:
        condition: service_healthy
    environment: *catalog-environment

  catalog-beat:
    image: intelegent-data-catalog-api:local
    container_name: intelegent-data-catalog-beat
    restart: unless-stopped
    command: ["celery", "-A", "intelegent_data_catalog.jobs.celery_app", "beat"]
    depends_on:
      redis:
        condition: service_healthy
      catalog-api:
        condition: service_healthy
    environment: *catalog-environment

  catalog-flower:
    image: intelegent-data-catalog-api:local
    container_name: intelegent-data-catalog-flower
    restart: unless-stopped
    command:
      [
        "celery",
        "-A",
        "intelegent_data_catalog.jobs.celery_app",
        "flower",
        "--address=0.0.0.0",
        "--port=5555",
      ]
    depends_on:
      redis:
        condition: service_healthy
      catalog-api:
        condition: service_healthy
    ports:
      - "${CATALOG_FLOWER_PORT:-5555}:5555"
    environment:
      <<: *catalog-environment
      FLOWER_UNAUTHENTICATED_API: "true"

  catalog-ui:
    build:
      context: .
      dockerfile: docker/catalog-ui/Dockerfile
      args:
        VITE_AUTH_ENABLED: "true"
        VITE_OIDC_AUTHORITY: http://localhost:${KEYCLOAK_PORT:-8180}/realms/catalog
        VITE_OIDC_CLIENT_ID: catalog-ui
    image: intelegent-data-catalog-ui:local
    container_name: intelegent-data-catalog-ui
    restart: unless-stopped
    depends_on:
      catalog-api:
        condition: service_healthy
    ports:
      - "${CATALOG_UI_PORT:-5173}:80"

  polaris-console:
    image: intelegent-data-catalog-polaris-console:3edb60fc
    build:
      context: https://github.com/apache/polaris-tools.git#3edb60fcb591e5f0f9f2fbf79ff0f457baae500e:console
      dockerfile: docker/Dockerfile
    container_name: intelegent-data-catalog-polaris-console
    restart: unless-stopped
    depends_on:
      polaris:
        condition: service_healthy
    ports:
      - "${POLARIS_UI_PORT:-8080}:8080"
    environment:
      VITE_POLARIS_API_URL: http://localhost:${POLARIS_HTTP_PORT:-8181}
      VITE_OAUTH_TOKEN_URL: http://localhost:${POLARIS_HTTP_PORT:-8181}/api/catalog/v1/oauth/tokens
      VITE_POLARIS_REALM: ${POLARIS_REALM:-POLARIS}
      VITE_POLARIS_PRINCIPAL_SCOPE: PRINCIPAL_ROLE:ALL
      VITE_POLARIS_REALM_HEADER_NAME: Polaris-Realm

  marquez:
    image: marquezproject/marquez:0.51.1
    container_name: intelegent-data-catalog-marquez
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${MARQUEZ_API_PORT:-5050}:5000"
      - "${MARQUEZ_ADMIN_PORT:-5051}:5001"
    environment:
      MARQUEZ_PORT: "5000"
      MARQUEZ_ADMIN_PORT: "5001"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      SEARCH_ENABLED: "false"
      JAVA_OPTS: "-Xms128m -Xmx512m"
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/5000"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  marquez-web:
    image: marquezproject/marquez-web:0.51.1
    container_name: intelegent-data-catalog-marquez-web
    restart: unless-stopped
    depends_on:
      marquez:
        condition: service_healthy
    ports:
      - "${MARQUEZ_WEB_PORT:-3000}:3000"
    environment:
      MARQUEZ_HOST: marquez
      MARQUEZ_PORT: "5000"
      WEB_PORT: "3000"

  spark-lineage:
    image: apache/spark:4.1.3-scala2.13-java17-python3-ubuntu
    container_name: intelegent-data-catalog-spark-lineage
    user: "0:0"
    init: true
    restart: "no"
    depends_on:
      polaris-setup:
        condition: service_completed_successfully
      marquez:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/opt/seed/seed-lineage.sh"]
    environment:
      POLARIS_URI: http://polaris:8181/api/catalog
      POLARIS_TOKEN_URI: http://polaris:8181/api/catalog/v1/oauth/tokens
      MARQUEZ_URL: http://marquez:5000
      SEED_FORCE: ${SEED_FORCE:-}
      ICEBERG_PACKAGES: org.apache.iceberg:iceberg-spark-runtime-4.1_2.13:1.11.0,org.apache.iceberg:iceberg-aws-bundle:1.11.0,io.openlineage:openlineage-spark_2.13:1.53.0
    volumes:
      - ./.local/polaris:/bootstrap:ro
      - ./docker/spark:/opt/seed:ro
      - spark_ivy:/tmp/ivy

  spark-sql:
    image: apache/spark:4.1.3-scala2.13-java17-python3-ubuntu
    container_name: intelegent-data-catalog-spark-sql
    user: "0:0"
    init: true
    restart: unless-stopped
    depends_on:
      minio:
        condition: service_healthy
      polaris-setup:
        condition: service_completed_successfully
      spark-lineage:
        condition: service_completed_successfully
    entrypoint: ["/bin/bash", "/opt/seed/query-server.sh"]
    environment:
      POLARIS_URI: http://polaris:8181/api/catalog
      POLARIS_TOKEN_URI: http://polaris:8181/api/catalog/v1/oauth/tokens
      QUERY_PORT: "8091"
      ICEBERG_PACKAGES: org.apache.iceberg:iceberg-spark-runtime-4.1_2.13:1.11.0,org.apache.iceberg:iceberg-aws-bundle:1.11.0
    ports:
      - "${SPARK_SQL_PORT:-8091}:8091"
    volumes:
      - ./.local/polaris:/bootstrap:ro
      - ./docker/spark:/opt/seed:ro
      - spark_ivy:/tmp/ivy
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 36
      start_period: 180s

  notebook-kernel:
    build:
      context: .
      dockerfile: docker/notebook-kernel/Dockerfile
    image: intelegent-data-catalog-notebook-kernel:local
    container_name: intelegent-data-catalog-notebook-kernel
    init: true
    restart: unless-stopped
    mem_limit: 3g
    cpus: 2
    depends_on:
      polaris-setup:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
      postgres:
        condition: service_healthy
      trino:
        condition: service_healthy
    environment:
      POLARIS_URI: http://polaris:8181/api/catalog
      POLARIS_TOKEN_URI: http://polaris:8181/api/catalog/v1/oauth/tokens
      NOTEBOOK_GATEWAY_TOKEN: ${NOTEBOOK_GATEWAY_TOKEN:-dev-notebook-token}
    volumes:
      - ./.local/polaris:/bootstrap:ro
      - ./docker/spark/spark-catalog-conf.sh:/opt/spark/spark-catalog-conf.sh:ro
      - spark_ivy:/tmp/ivy
    healthcheck:
      test: ["CMD", "/opt/venv/bin/python", "/opt/kernel/healthcheck.py"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

volumes:
  neo4j_data:
  minio_data:
  postgres_data:
  spark_ivy:
  openobserve_data:
  vector_data:
