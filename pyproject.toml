[project]
name = "intelegent-data-catalog"
version = "0.1.0"
description = "Intelligent data catalog"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "dependency-injector>=4.49.1",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "kagglehub>=1.0.2",
    "neo4j>=6.3.1",
    "opentelemetry-exporter-otlp-proto-http>=1.45.1",
    "opentelemetry-sdk>=1.45.1",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13.5",
    "pydantic-ai-slim[anthropic,openai]>=2.54.0",
    "pydantic-settings>=2.15.0",
    "pyiceberg[pyarrow,sql-sqlite]>=0.12.0",
    "sqlalchemy>=2.0.54",
    "sqlglot>=30.20.0",
    "trino>=0.340.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
intelegent-data-catalog = "intelegent_data_catalog.__main__:main"
intelegent-data-catalog-api = "intelegent_data_catalog.api.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/intelegent_data_catalog"]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = ["-ra", "--strict-markers", "--strict-config"]
filterwarnings = ["error"]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "RUF"]
ignore = ["ANN401"]

[tool.ruff.lint.isort]
known-first-party = ["intelegent_data_catalog"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
mypy_path = "src"
explicit_package_bases = true
packages = ["intelegent_data_catalog"]

[tool.pyright]
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"
extraPaths = ["src"]
executionEnvironments = [
    { root = "airflow", pythonVersion = "3.12", extraPaths = [
        "airflow",
        "airflow/.venv/lib/python3.12/site-packages",
    ] },
]
