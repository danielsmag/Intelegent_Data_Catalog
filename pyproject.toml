[project]
name = "intelegent-data-catalog"
version = "0.1.0"
description = "Intelligent data catalog"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "boto3>=1.43.114",
    "celery[redis]>=5.6.3",
    "croniter>=6.2.4",
    "dependency-injector>=4.49.1",
    "fastapi>=0.141.1",
    "flower>=2.2.0",
    "httpx>=0.28.1",
    "kagglehub>=1.0.2",
    "langchain-anthropic>=1.0",
    "langchain-core>=1.0",
    "langchain-ollama>=1.0",
    "langchain-openai>=1.0",
    "langgraph>=1.0",
    "langgraph-checkpoint-postgres>=3.0",
    "neo4j>=6.3.1",
    "opentelemetry-exporter-otlp-proto-http>=1.45.1",
    "opentelemetry-sdk>=1.45.1",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyiceberg[pyarrow,sql-sqlite]>=0.12.0",
    "pyjwt[crypto]>=2.15.1",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.54",
    "sqlglot>=30.20.0",
    "trino>=0.340.0",
    "uvicorn>=0.54.0",
    "websockets>=14.0",
]

[project.scripts]
intelegent-data-catalog = "intelegent_data_catalog.__main__:main"
intelegent-data-catalog-api = "intelegent_data_catalog.api.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/intelegent_data_catalog"]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]
docs = [
    "pydata-sphinx-theme>=0.23.0",
    "pyyaml>=6.0.3",
    "setuptools>=70,<82",
    "six>=1.17.0",
    "sphinx>=9.2.0",
    "sphinx-copybutton>=0.5.2",
    "sphinx-design>=0.7.0",
    "sphinxcontrib-redoc>=1.6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = ["-ra", "--strict-markers", "--strict-config"]
filterwarnings = ["error"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "RUF"]
ignore = ["ANN401"]

[tool.ruff.lint.isort]
known-first-party = ["intelegent_data_catalog"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
mypy_path = "src"
explicit_package_bases = true
packages = ["intelegent_data_catalog"]

[[tool.mypy.overrides]]
module = ["celery", "celery.*", "boto3", "boto3.*", "croniter", "croniter.*"]
ignore_missing_imports = true

[tool.pyright]
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"
extraPaths = ["src"]
executionEnvironments = [
    { root = "airflow", pythonVersion = "3.12", extraPaths = [
        "airflow",
        "airflow/.venv/lib/python3.12/site-packages",
    ] },
]
