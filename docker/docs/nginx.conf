server {
    listen 80;
    server_name _;
    # Relative redirects keep the host port. An absolute redirect uses the
    # container listen port (80) and the browser then gets connection refused.
    absolute_redirect off;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/index.html $uri.html =404;
    }
}
