server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker DNS. A bare proxy_pass hostname is resolved once at start, so a
    # recreated catalog-api keeps the old IP and the UI returns 502.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $catalog_upstream catalog-api:8090;
        proxy_pass http://$catalog_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Knowledge context waits on the local model. The 60s default returns 504.
        proxy_connect_timeout 10s;
        proxy_send_timeout 210s;
        proxy_read_timeout 210s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
