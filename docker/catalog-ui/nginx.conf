map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
}

server {
    listen 80;
    server_name _;
    # Relative redirects keep the host port (5173). An absolute redirect uses
    # the container listen port (80) and the browser then gets connection refused.
    absolute_redirect off;
    root /usr/share/nginx/html;
    index index.html;

    # Docker DNS. A bare proxy_pass hostname is resolved once at start, so a
    # recreated catalog-api keeps the old IP and the UI returns 502.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $catalog_upstream catalog-api:8090;
        proxy_pass http://$catalog_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Kernel start waits on Spark, and the channel socket stays open.
        proxy_connect_timeout 10s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }

    # Vite writes bundles into /assets/. Exact routes must serve the SPA.
    # A directory match 301s to /assets/ and then 403s, so refresh of the
    # assets page never reaches the client router.
    location = /assets {
        try_files /index.html =404;
    }

    location = /assets/ {
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
