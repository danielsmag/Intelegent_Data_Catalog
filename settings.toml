# Application settings. Environment variables with the CATALOG_ prefix override
# this file. Nested keys use a double underscore: CATALOG_SCAN__INTERVAL_SECONDS.

[app]
name = "intelegent-data-catalog"
debug = false

[logging]
level = "INFO"
format = "%(asctime)s %(levelname)-8s [%(name)s] %(message)s"
debug_format = "%(asctime)s %(levelname)-8s [%(name)s] %(filename)s:%(lineno)d %(message)s"
date_format = "%Y-%m-%d %H:%M:%S"
log_to_console = true
log_to_file = false
log_file = "logs/catalog.log"

[scan]
interval_seconds = 30
db_dir = "db"

[query]
spark_url = "http://127.0.0.1:8091"
sample_limit = 100
max_sample_limit = 500
max_query_rows = 500
max_sql_chars = 8000
query_timeout_seconds = 60

[database]
url = "postgresql+psycopg://catalog:catalog@127.0.0.1:5432/catalog"
auto_migrate = false

[polaris]
uri = "http://localhost:8181"
realm = "POLARIS"
catalog = "catalog"
client_id = "root"
client_secret = "s3cr3t"
timeout_seconds = 30

# Table-agent language model. provider is claude, openai, or ollama.
# Empty model uses claude-sonnet-4-5, gpt-4.1, or llama3.2.
# Empty base_url uses that provider's host. No /v1 suffix.
# Point model at a name from `ollama list` for a local model.
# Claude and OpenAI read the key from CATALOG_LLM__API_KEY.
# Each space, scope, table, and Airflow instance picks a model:
# llama3.2, qwen3:4b, gpt-4.1-mini, gpt-4.1, or gpt-6-astra.
# effort is the thinking level copied onto a new configuration row.
# Values: off, minimal, low, medium, high, or xhigh. Off disables reasoning.
# The first two use Ollama. The GPT ids use OpenAI.
# A GPT entity needs CATALOG_LLM__GPT__API_KEY, or CATALOG_LLM__API_KEY when
# provider is openai. [llm.local] and [llm.gpt] override that endpoint.
[llm]
provider = "openai"
model = "gpt-4.1"
api_key = ""
base_url = ""
timeout_seconds = 60
# Completion budget. GPT-4.1 and GPT-4.1 mini are capped at 32768 before the call.
# GPT-6 Astra keeps this value.
max_tokens = 100000
temperature = 0.0
max_tool_steps = 6
effort = "low"

# Airflow 3 REST calls. Instance URL and password are stored per instance.
[airflow]
timeout_seconds = 30

# How much text and how many objects a context build sends to the model.
# text_chars clips each description and stored context field.
# trace_detail_chars clips only the stream-tracing panel.
[context]
text_chars = 200
airflow_source_chars = 3000
airflow_max_dags = 20
airflow_max_tasks = 60
airflow_max_candidate_tables = 300
max_pipelines = 30
scope_max_tables = 40
scope_max_columns = 400
space_max_scopes = 20
space_max_tables = 60
space_max_columns = 600
trace_detail_chars = 2000

# How often Beat looks for due rows. The saved configuration interval is the
# schedule. Beat enqueues a target only when that row is due.
# Beat requeues a running build whose worker lease has expired. After
# abandon_after_seconds the build fails even if the worker still holds the
# lease, so a stuck model call cannot leave the trace clock running.
[celery]
broker_url = "redis://127.0.0.1:6379/0"
dispatch_interval_seconds = 60
task_always_eager = false
lease_seconds = 90
reclaim_after_seconds = 120
abandon_after_seconds = 1800
visibility_timeout_seconds = 7200

# OpenObserve export. Compose sets CATALOG_OBSERVABILITY__ENABLED=true.
# A host run stays off until that variable is set.
[observability]
enabled = false
endpoint = "http://127.0.0.1:5080/api/default"
service_name = "intelegent-data-catalog"
username = "root@example.com"
password = ""
include_content = true
